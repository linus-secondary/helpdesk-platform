AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Account security baseline for the IT Helpdesk Platform: CloudTrail audit logging (multi-region,
  encrypted, log-file validation), Amazon GuardDuty threat detection with high-severity findings sent
  to SNS, IAM Access Analyzer, and optional AWS Security Hub.

Parameters:
  ProjectName:
    Type: String
    Default: helpdesk-platform
  AlertTopicArn:
    Type: String
    Description: SNS topic for security alerts (Terraform output sns_topic_arn)
  EnableSecurityHub:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Security Hub has a 30-day free trial, then charges per check. Off by default.
  CreateGuardDutyDetector:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if GuardDuty is already enabled in this region (only one detector is allowed).

Conditions:
  WantSecurityHub: !Equals [!Ref EnableSecurityHub, "true"]
  WantGuardDuty: !Equals [!Ref CreateGuardDutyDetector, "true"]

Resources:
  # ---------------------------------------------------------------- CloudTrail
  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-cloudtrail-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-logs
            Status: Enabled
            ExpirationInDays: 90

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals: {"s3:x-amz-acl": bucket-owner-full-control}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt TrailBucket.Arn, !Sub "${TrailBucket.Arn}/*"]
            Condition:
              Bool: {"aws:SecureTransport": "false"}

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Sub "${ProjectName}-trail"
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true   # detects tampering with audit logs

  # ---------------------------------------------------------------- GuardDuty
  Detector:
    Type: AWS::GuardDuty::Detector
    Condition: WantGuardDuty
    Properties:
      Enable: true
      FindingPublishingFrequency: FIFTEEN_MINUTES
      Features:
        - {Name: EKS_AUDIT_LOGS, Status: ENABLED}
        - {Name: S3_DATA_EVENTS, Status: ENABLED}

  HighSeverityFindingsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-guardduty-high"
      Description: Send GuardDuty findings with severity >= 7 (high) to the alerts topic
      EventPattern:
        source: ["aws.guardduty"]
        detail-type: ["GuardDuty Finding"]
        detail:
          severity: [{numeric: [">=", 7]}]
      Targets:
        - Arn: !Ref AlertTopicArn
          Id: alerts-topic
          InputTransformer:
            InputPathsMap:
              type: "$.detail.type"
              severity: "$.detail.severity"
              region: "$.region"
              title: "$.detail.title"
            InputTemplate: '"GuardDuty <severity> finding in <region>: <type> - <title>"'

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopicArn]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlertTopicArn
          - Sid: AllowAccountPublish
            Effect: Allow
            Principal: {AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"}
            Action: ["sns:Publish", "sns:Subscribe", "sns:GetTopicAttributes"]
            Resource: !Ref AlertTopicArn
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlertTopicArn

  # ---------------------------------------------------------------- IAM Access Analyzer (free)
  AccessAnalyzer:
    Type: AWS::AccessAnalyzer::Analyzer
    Properties:
      AnalyzerName: !Sub "${ProjectName}-analyzer"
      Type: ACCOUNT

  # ---------------------------------------------------------------- Security Hub (optional)
  SecurityHub:
    Type: AWS::SecurityHub::Hub
    Condition: WantSecurityHub
    Properties:
      EnableDefaultStandards: true
      ControlFindingGenerator: SECURITY_CONTROL

Outputs:
  TrailBucketName:
    Value: !Ref TrailBucket
  DetectorId:
    Condition: WantGuardDuty
    Value: !Ref Detector
