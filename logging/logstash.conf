# Parses the services' JSON log lines and indexes them in Elasticsearch (one index per day).
input {
  beats { port => 5044 }
}

filter {
  json {
    source => "message"
    skip_on_invalid_json => true
  }
  if [ts] {
    date { match => ["ts", "yyyy-MM-dd'T'HH:mm:ss"] timezone => "UTC" }
  }
  mutate { remove_field => ["agent", "ecs", "input", "log", "host"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
}
