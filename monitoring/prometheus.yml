global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: helpdesk
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000", "tickets:8000", "sla:8000", "notifications:8000", "chatbot:8000"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance
        replacement: "$1"
