groups:
  - name: helpdesk-platform
    rules:
      - alert: ServiceDown
        expr: up{job="helpdesk"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is down"

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (service) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} 5xx error rate above 5%"

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} p95 latency above 2 seconds"

  - name: helpdesk-business
    rules:
      - alert: P1TicketBreachedSLA
        expr: helpdesk_sla_breached_open_tickets{priority="P1"} > 0
        labels: { severity: critical }
        annotations:
          summary: "{{ $value }} open P1 ticket(s) have breached SLA"

      - alert: TicketBacklogGrowing
        expr: sum(helpdesk_open_tickets) > 50
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "More than 50 open tickets for 30 minutes"

      - alert: LoginFailuresSpike
        expr: sum(increase(http_requests_total{status="401"}[5m])) > 50
        labels: { severity: warning }
        annotations:
          summary: "More than 50 unauthorised API calls in 5 minutes (possible attack or expired tokens)"
